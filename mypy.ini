# Shared mypy configuration for the integration workers
# (integration_workers/{google,immich,strava,snipeit}).
#
# mypy has no config "extends"/inheritance (unlike ruff), and it does NOT walk
# up the directory tree to discover config. Each worker therefore consumes this
# file explicitly from its own directory:
#
#     uv run mypy --config-file ../../mypy.ini .
#
# `explicit_package_bases = true` makes the current working directory an
# automatic package base, so running `mypy .` from the worker dir resolves the
# worker's top-level modules without a per-worker `mypy_path`.

[mypy]
python_version = 3.14
plugins = pydantic.mypy
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
explicit_package_bases = true

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Third-party libraries without (complete) type stubs. These sections are inert
# for workers that do not import the module, so a single shared file is safe.
[mypy-google.*]
ignore_missing_imports = true

[mypy-googleapiclient.*]
ignore_missing_imports = true

[mypy-redis.*]
ignore_missing_imports = true

# Tests are not shipped, so strictness is relaxed for them. `ignore_errors`
# gives one uniform test policy across all workers: previously only the google
# worker set it (its test suite is not mypy-clean), while the others did not.
# Unifying on it keeps every worker green under the shared config; the trade-off
# is that type errors in worker tests/ are no longer surfaced.
[mypy-tests.*]
disallow_untyped_defs = false
check_untyped_defs = false
ignore_errors = true
