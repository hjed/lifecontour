[project]
name = "personal-management-backend"
version = "0.1.0"
description = "Personal CRM & Journal System - FastAPI Backend"
authors = [
    {name = "Personal Management System", email = "dev@example.com"}
]
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.31.0",
    "python-multipart>=0.0.27",
    "authlib>=1.7.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "structlog>=23.2.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
    "opentelemetry-instrumentation-httpx>=0.42b0",
    "opentelemetry-exporter-otlp>=1.41.1",
    "python-stdnum>=1.20",
    "pycountry>=23.12.11",
    "meilisearch>=0.41.0",
    "itsdangerous>=2.1.0",
    "fastmcp>=3.2.4",
    "dishka>=1.10.1",
    "arq>=0.28.0",
    "core_shared",
    "google-api-python-client>=2.196.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "cryptography>=48.0.0",
    "aiohttp>=3.9.0",
    "gpxpy>=1.6.0",
    "google-genai>=2.4.0",
    "opentelemetry-instrumentation-logging>=0.62b1",
    "opentelemetry-instrumentation-redis>=0.62b1",
    "reportlab>=4.0",
    # Pin importlib-metadata below 8.0 to work around breaking change where
    # __getitem__ raises KeyError for missing metadata keys. aiofile 3.9.0
    # (transitive dep of fastmcp) uses metadata["Author"] which crashes.
    # Remove this pin once aiofile releases a fix.
    "importlib-metadata<8.0",
]

[tool.uv.sources]
core_shared = { path = "../core_shared", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",  # for testing
    "asyncpg>=0.29.0",  # for async PostgreSQL testing
    "ruff>=0.15.12",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "types-authlib>=1.6.11.20260512",  # type stubs for authlib
    "respx>=0.23.1",  # for mocking httpx requests in tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Use spaces around the equals sign
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Automatically detect line ending
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "psycopg2.*",
    "stdnum.*",
    "pycountry.*",
    "authlib.integrations.starlette_client",
    "googleapiclient.*",
    "arq.*",
    "dishka.*",
    "fastmcp.*",
    "redis.asyncio",
    "opentelemetry.exporter.otlp.proto.http.trace_exporter",
    "googleapiclient.*",
    "gpxpy.*",
    "google.genai.*",
    "reportlab.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Specific override for pytest async generator fixture typing issue
[[tool.mypy.overrides]]
module = "tests.integration.google.test_google_client"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::pytest.PytestDeprecationWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "meilisearch: marks tests that require MeiliSearch to be running",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pypdf>=6.11.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
    "types-authlib>=1.6.11.20260512",
]

[tool.alembic]
script_location = "%(here)/app/migrations"
file_template = "4d_%%(rev)s_%%(slug)s.py"

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "console_scripts"
entrypoint = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
