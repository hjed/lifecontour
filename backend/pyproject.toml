[project]
name = "personal-management-backend"
version = "0.1.0"
description = "Personal CRM & Journal System - FastAPI Backend"
authors = [
    {name = "Personal Management System", email = "dev@example.com"}
]
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.31.0",
    "python-multipart>=0.0.32",
    "authlib>=1.7.2",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
    "opentelemetry-instrumentation-httpx>=0.42b0",
    "opentelemetry-exporter-otlp>=1.41.1",
    "python-stdnum>=1.20",
    "pycountry>=23.12.11",
    "meilisearch>=0.41.1",
    "itsdangerous>=2.1.0",
    "fastmcp>=3.4.2",
    "dishka>=1.10.1",
    "arq>=0.28.0",
    "core_shared",
    "google-api-python-client>=2.197.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "cryptography>=49.0.0",
    "aiohttp>=3.14.1",
    "gpxpy>=1.6.0",
    # Cap below 2.8.0: that release deep-copies the GenerateContentConfig
    # (models.py: config.model_copy(deep=True)) at the top of generate_content,
    # which crashes with "cannot pickle '_asyncio.Future' object" when a live
    # fastmcp MCP ClientSession is passed as a tool (the documented pattern).
    # Lift the cap once google-genai fixes the AFC deep-copy regression.
    "google-genai>=2.7.0,<2.8.0",
    "opentelemetry-instrumentation-logging>=0.62b1",
    "opentelemetry-instrumentation-redis>=0.62b1",
    "reportlab>=4.0",
    # Pin importlib-metadata below 8.0 to work around breaking change where
    # __getitem__ raises KeyError for missing metadata keys. aiofile 3.9.0
    # (transitive dep of fastmcp) uses metadata["Author"] which crashes.
    # Remove this pin once aiofile releases a fix.
    "importlib-metadata<10.0",
]

[tool.uv.sources]
core_shared = { path = "../core_shared", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",  # for testing
    "asyncpg>=0.29.0",  # for async PostgreSQL testing
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "types-authlib>=1.6.11.20260518",  # type stubs for authlib
    "respx>=0.23.1",  # for mocking httpx requests in tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = ["B011", "DTZ"]
"tests/**/conftest.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"test_*.py" = ["DTZ"]
"verify_*.py" = ["DTZ", "BLE001"]
"scripts/**/*" = ["BLE001"]

[tool.mypy]
python_version = "3.14"
plugins = [
    "pydantic.mypy"
]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


[[tool.mypy.overrides]]
module = [
    "psycopg2.*",
    "reportlab.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Specific override for pytest async generator fixture typing issue
[[tool.mypy.overrides]]
module = "tests.integration.google.test_google_client"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::pytest.PytestDeprecationWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "meilisearch: marks tests that require MeiliSearch to be running",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pypdf>=6.13.3",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.17",
    "types-authlib>=1.6.11.20260518",
]

[tool.alembic]
script_location = "%(here)/app/migrations"
file_template = "4d_%%(rev)s_%%(slug)s.py"

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "console_scripts"
entrypoint = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[tool.uv]
override-dependencies = ["redis>=8.0.0"]

