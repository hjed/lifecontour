# SonarCloud configuration for Personal Management System

# Project identification
sonar.projectKey=personal-management-system
sonar.organization=hjed
sonar.projectName=Personal Management System
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/migrations/**,**/__pycache__/**,**/venv/**,**/build/**,**/dist/**

# Language-specific settings
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.14
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# Python specific
sonar.python.xunit.reportPath=backend/test-results.xml

# JavaScript/TypeScript specific
sonar.testExecutionReportPaths=frontend/test-results.xml

# Code analysis settings
sonar.qualitygate.wait=true
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/tests/**,**/migrations/**

# Rule exclusions
# Suppress Interoperability rule - FromDishka[Cls] is Dishka's recommended pattern, not Annotated[Cls, FromDishka()]
# This is a false positive as Dishka's own deprecation warnings confirm FromDishka[Cls] is correct
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S8410
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/app/api/**/*.py
sonar.issue.ignore.multicriteria=e1

# Additional settings
sonar.sourceEncoding=UTF-8
