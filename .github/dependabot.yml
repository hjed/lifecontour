version: 2
updates:
  # Python backend dependencies (using uv)
  - package-ecosystem: "uv"
    directories:
      - "/backend"
      - "/integration_workers/google"
      - "/core_shared"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
    groups:
      development-dependencies:
        dependency-type: "development"
      google:
        applies-to: version-updates
        patterns:
          - "google*"
      pydantic:
        applies-to: version-updates
        patterns:
          - "pydantic*"
      sql:
        applies-to: version-updates
        patterns:
          - "sqlalchemy*"
          - "alembic*"
          - "psycopg*"
      minor-and-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "google*"
          - "pydantic*"
          - "sqlalchemy*"
          - "alembic*"
          - "psycopg*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(frontend)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      radix:
        applies-to: version-updates
        patterns:
          - "@radix-ui*"
      tanstack:
        applies-to: version-updates
        patterns:
          - "@tanstack*"
      react:
        applies-to: version-updates
        patterns:
          - "react*"
          - "@types/react*"
      jest:
        applies-to: version-updates
        patterns:
          - "jest*"
          - "@types/jest*"
      eslint:
        applies-to: version-updates
        patterns:
          - "eslint*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "eslint*"
          - "jest*"
          - "@types/jest*"
          - "react*"
          - "@types/react*"
          - "@tanstack*"
          - "@radix-ui*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/docker/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/docker/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"


