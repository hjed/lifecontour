version: 2

multi-ecosystem-groups:
  # Test-only dependencies; monthly is enough.
  oauth-test-infra:
    schedule:
      interval: "monthly"
      time: "09:00"
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

updates:
  # Python backend dependencies (using uv)
  - package-ecosystem: "uv"
    directories:
      - "/backend"
      - "/integration_workers/google"
      - "/integration_workers/immich"
      - "/integration_workers/strava"
      - "/integration_workers/snipeit"
      - "/core_shared"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # reduce noise for none security depedencies
    cooldown:
      default-days: 4
    open-pull-requests-limit: 5
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
    groups:
      development-dependencies:
        dependency-type: "development"
      google:
        applies-to: version-updates
        patterns:
          - "google*"
      pydantic:
        applies-to: version-updates
        patterns:
          - "pydantic*"
      sql:
        applies-to: version-updates
        patterns:
          - "sqlalchemy*"
          - "alembic*"
          - "psycopg*"
      minor-and-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "google*"
          - "pydantic*"
          - "sqlalchemy*"
          - "alembic*"
          - "psycopg*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 4
    open-pull-requests-limit: 3
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(frontend)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      radix:
        applies-to: version-updates
        patterns:
          - "@radix-ui*"
      tanstack:
        applies-to: version-updates
        patterns:
          - "@tanstack*"
      next:
        applies-to: version-updates
        patterns:
          - "next*"
          - "eslint-config-next"
      react:
        applies-to: version-updates
        patterns:
          - "react*"
          - "@types/react*"
      jest:
        applies-to: version-updates
        patterns:
          - "jest*"
          - "@types/jest*"
      eslint:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "@typescript-eslint*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "eslint*"
          - "jest*"
          - "@types/jest*"
          - "react*"
          - "@types/react*"
          - "@tanstack*"
          - "@radix-ui*"
          - "@typescript-eslint*"
          - "next*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Docker dependencies
  # Covers the backend and every integration worker: their Dockerfiles only
  # `FROM pms-python-base`, a local image Dependabot cannot resolve, so the real
  # base image is tracked here.
  - package-ecosystem: "docker"
    directory: "/docker/python-base"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/docker/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # OAuth and test infrastructure: one monthly PR via the oauth-test-infra
  # group. Every entry matches "*" because a multi-ecosystem job never
  # updates dependencies its patterns leave out.
  - package-ecosystem: "docker"
    directories:
      - "/docker/oauth-login-consent"
      - "/docker/oauth-provider"
      - "/docker/nginx"
    patterns: ["*"]
    multi-ecosystem-group: "oauth-test-infra"
    cooldown:
      default-days: 4

  - package-ecosystem: "npm"
    directory: "/docker/oauth-login-consent"
    patterns: ["*"]
    multi-ecosystem-group: "oauth-test-infra"
    cooldown:
      default-days: 4

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    assignees:
      - "hjed"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"


