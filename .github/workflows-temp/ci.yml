name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  UV_VERSION: "0.7.9"
  PNPM_VERSION: "10.11.0"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      core-shared: ${{ steps.changes.outputs.core-shared }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            core-shared:
              - 'core_shared/**'
            frontend:
              - 'frontend/**'

  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run Ruff (linting)
        run: uv run ruff check .

      - name: Run Ruff (formatting check)
        run: uv run ruff format --check .

      - name: Run MyPy (type checking)
        run: uv run mypy .

  core-shared-lint:
    name: Core Shared Linting
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core-shared == 'true'
    defaults:
      run:
        working-directory: ./core_shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-core-shared-${{ hashFiles('core_shared/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-core-shared-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy .

  backend-unit-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          TESTING: true
        run: uv run pytest -m unit --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./backend/coverage.xml
          flags: backend-unit
          name: backend-unit-coverage

  core-shared-unit-test:
    name: Core Shared Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core-shared == 'true'
    defaults:
      run:
        working-directory: ./core_shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-core-shared-${{ hashFiles('core_shared/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-core-shared-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run unit tests
        run: uv run pytest --cov=core_shared --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./core_shared/coverage.xml
          flags: core-shared-unit
          name: core-shared-unit-coverage

  backend-integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: personal_management_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      meilisearch:
        image: getmeili/meilisearch:v1.2
        env:
          MEILI_MASTER_KEY: test_master_key
          MEILI_ENV: development
          MEILI_LOG_LEVEL: INFO
          MEILI_NO_ANALYTICS: true
        options: >-
          --health-cmd "curl -f http://localhost:7700/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
        ports:
          - 7701:7700

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install PostgreSQL and Redis clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Wait for services to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

          echo "Waiting for MeiliSearch..."
          for i in {1..30}; do
            if curl -f http://localhost:7701/health; then
              echo "MeiliSearch is ready!"
              break
            fi
            echo "Waiting for MeiliSearch... ($i/30)"
            sleep 2
          done

          echo "Waiting for Redis..."
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
              echo "Redis is ready!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/personal_management_test
        run: |
          echo "Running database migrations..."
          uv run alembic upgrade head
          echo "Database migrations completed successfully"

      - name: Run integration tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_NAME: personal_management_test
          MEILISEARCH_URL: http://localhost:7701
          MEILISEARCH_API_KEY: test_master_key
          REDIS_URL: redis://localhost:6379
        run: uv run pytest tests/integration/ -v --tb=short

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm type-check

      - name: Run Prettier check
        run: |
          echo "Running Prettier check..."
          # List files that will be checked
          echo "Files to be checked:"
          find . -name "*.js" -o -name "*.ts" -o -name "*.tsx" -o -name "*.json" -o -name "*.md" | grep -v node_modules | head -10
          # Run prettier check
          pnpm format:check || (echo "Prettier check failed. Running format to see differences..." && pnpm format && exit 1)

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  frontend-e2e-test:
    name: Frontend E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, "Mobile Chrome"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check system resources
        run: |
          echo "🔍 System information:"
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h)"
          echo "Disk space: $(df -h)"
          echo "Docker version: $(docker --version)"
          echo "Docker Compose version: $(docker compose version)"

      - name: Setup Docker environment for e2e tests
        run: |
          docker buildx bake --file docker-compose.test.yml --file docker/gha-compose-testing-cache.json
          echo "🐳 Starting Docker services for e2e tests..."
          docker compose -f docker-compose.test.yml up -d

          echo "📋 Checking Docker services status..."
          docker compose -f docker-compose.test.yml ps

          echo "📋 Checking Docker service logs for any immediate errors..."
          docker compose -f docker-compose.test.yml logs --tail=20

          echo "⏳ Waiting for services to be ready..."

          # Wait for backend to be healthy with more detailed logging
          echo "Waiting for backend API..."
          for i in {1..60}; do
            if curl -f -s http://localhost:8001/api/health > /dev/null 2>&1; then
              echo "✅ Backend is ready!"
              break
            fi
            echo "Backend not ready yet... ($i/60)"
            if [ $i -eq 60 ]; then
              echo "❌ Backend failed to start. Checking logs..."
              docker compose -f docker-compose.test.yml logs backend-test
              exit 1
            fi
            sleep 5
          done

          # Wait for OAuth provider to be ready
          echo "Waiting for OAuth provider..."
          for i in {1..60}; do
            if curl -f -s http://localhost:4447/health/ready > /dev/null 2>&1; then
              echo "✅ OAuth provider is ready!"
              break
            fi
            echo "OAuth provider not ready yet... ($i/60)"
            if [ $i -eq 60 ]; then
              echo "❌ OAuth provider failed to start. Checking logs..."
              docker compose -f docker-compose.test.yml logs oauth-provider-test
              exit 1
            fi
            sleep 5
          done

          # Wait for MeiliSearch to be healthy
          echo "Waiting for MeiliSearch..."
          for i in {1..60}; do
            if curl -f -s http://localhost:7701/health > /dev/null 2>&1; then
              echo "✅ MeiliSearch is ready!"
              break
            fi
            echo "MeiliSearch not ready yet... ($i/60)"
            if [ $i -eq 60 ]; then
              echo "❌ MeiliSearch failed to start. Checking logs..."
              docker compose -f docker-compose.test.yml logs meilisearch-test
              exit 1
            fi
            sleep 5
          done

          # OAuth initialization is handled automatically by Docker Compose dependencies
          # The backend service depends on oauth-init-test with condition: service_completed_successfully
          # So if the backend is healthy, oauth-init-test must have completed successfully
          echo "✅ OAuth initialization is handled by Docker Compose dependencies"

          echo "🎉 All services are ready for e2e tests!"

          # Final verification - test actual API endpoints
          echo "🔍 Final verification of service endpoints..."

          echo "Testing backend health..."
          curl -f -s http://localhost:8001/api/health || (echo "❌ Backend health check failed" && exit 1)
          echo "✅ Backend health check passed"

          echo "Testing OAuth provider health..."
          curl -f -s http://localhost:4447/health/ready || (echo "❌ OAuth provider health check failed" && exit 1)
          echo "✅ OAuth provider health check passed"

          echo "Testing MeiliSearch health..."
          curl -f -s http://localhost:7701/health || (echo "❌ MeiliSearch health check failed" && exit 1)
          echo "✅ MeiliSearch health check passed"

          echo "Testing OAuth client configuration..."
          curl -f -s http://localhost:4447/admin/clients/test-client-id > /dev/null || (echo "❌ OAuth client not found" && exit 1)
          echo "✅ OAuth client configuration verified"

          echo "✅ All service endpoints verified and ready for testing!"

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: |
          # Install chromium for global setup (always needed) plus the target browser
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            pnpm exec playwright install --with-deps chromium firefox
          elif [ "${{ matrix.browser }}" = "Mobile Chrome" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run Playwright tests
        working-directory: ./frontend
        timeout-minutes: 30  # Prevent hanging indefinitely
        env:
          CI: true
          CLEANUP_AFTER_TESTS: true
        run: pnpm exec playwright test --project="${{ matrix.browser }}"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Cleanup Docker environment
        if: always()
        run: |
          echo "🧹 Cleaning up Docker environment..."
          docker compose -f docker-compose.test.yml down --volumes --remove-orphans
          echo "✅ Cleanup complete"

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [changes, backend-lint, core-shared-lint, backend-unit-test, core-shared-unit-test, backend-integration-test, frontend-lint, frontend-test, frontend-e2e-test]
    if: always() && !cancelled() && !failure()

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-


      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker build
        run: |
          docker buildx build -f docker/backend/Dockerfile . -t backend:test --cache-from=type=gha --cache-to=type=gha,mode=max --load
          docker buildx build -f docker/frontend/Dockerfile . -t frontend:test --cache-from=type=gha --cache-to=type=gha,mode=max --load

      - name: Run Trivy vulnerability scanner - Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend:test'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'

      - name: Run Trivy vulnerability scanner - Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'frontend:test'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'

      - name: Upload Trivy scan results as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: |
            trivy-backend-results.sarif
            trivy-frontend-results.sarif

