name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  UV_VERSION: "0.7.9"
  PNPM_VERSION: "11.0.4"

jobs:
  # Detect which files have changed to conditionally run jobs
  changes:
    runs-on: ubuntu-latest
    # Required permissions for pull requests
    permissions:
      contents: read
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      core_shared: ${{ steps.filter.outputs.core_shared }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**/*.py'
              - 'backend/**/*.toml'
              - 'backend/**/uv.lock'
              - 'backend/**/Dockerfile*'
              - 'backend/**/docker-compose*.yml'
              - 'backend/**/docker-compose*.yaml'
              - 'core_shared/**/*.py'
              - 'core_shared/**/*.toml'
              - 'core_shared/**/uv.lock'
              - 'core_shared/**/Dockerfile*'
              - 'core_shared/**/docker-compose*.yml'
              - 'core_shared/**/docker-compose*.yaml'
              - 'integration_workers/**/*.py'
              - 'integration_workers/**/*.toml'
              - 'integration_workers/**/uv.lock'
              - 'integration_workers/**/Dockerfile*'
              - 'integration_workers/**/docker-compose*.yml'
              - 'integration_workers/**/docker-compose*.yaml'
            core_shared:
              - 'core_shared/**/*.py'
              - 'core_shared/**/*.toml'
            frontend:
              - 'frontend/**/*.ts'
              - 'frontend/**/*.tsx'
              - 'frontend/**/*.js'
              - 'frontend/**/*.jsx'
              - 'frontend/**/*.json'

  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: ./backend
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run Ruff (linting)
        run: uv run ruff check .

      - name: Run Ruff (formatting check)
        run: uv run ruff format --check .

      - name: Run MyPy (type checking)
        run: uv run mypy .

  core-shared-lint:
    name: Core Shared Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core_shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-core-shared-${{ hashFiles('core_shared/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-core-shared-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy .

  backend-unit-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: ./backend
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          TESTING: true
        run: uv run pytest -m unit --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          file: ./backend/coverage.xml
          flags: backend-unit
          name: backend-unit-coverage

  core-shared-unit-test:
    name: Core Shared Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core_shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-core-shared-${{ hashFiles('core_shared/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-core-shared-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run unit tests
        run: uv run pytest --cov=core_shared --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./core_shared/coverage.xml
          flags: core-shared-unit
          name: core-shared-unit-coverage

  worker-unit-test:
    name: Google Contacts Worker Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: ./integration_workers/google
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # Worker uses Python 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  worker-integration-test:
    name: Google Contacts Worker Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: ./integration_workers/google
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: personal_management_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"  # Worker uses Python 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/personal_management_test
        run: |
          echo "Installing backend dependencies for migrations..."
          uv sync
          echo "Running database migrations..."
          uv run alembic upgrade head
          echo "Database migrations completed successfully"

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/personal_management_test
          REDIS_URL: redis://localhost:6379
          GOOGLE_CLIENT_ID: test_client_id
          GOOGLE_CLIENT_SECRET: test_client_secret
          ENCRYPTION_KEY: test_encryption_key_32_characters_long_for_testing
        run: uv run pytest tests/integration/ -v --tb=short

  strava-worker-unit-test:
    name: Strava Worker Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: ./integration_workers/strava
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  strava-worker-lint:
    name: Strava Worker Lint & Type Check
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: ./integration_workers/strava
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy .

  backend-integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: ./backend
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: personal_management_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      meilisearch:
        image: getmeili/meilisearch:v1.38
        env:
          MEILI_MASTER_KEY: test_master_key
          MEILI_ENV: development
          MEILI_LOG_LEVEL: INFO
          MEILI_NO_ANALYTICS: true
        options: >-
          --health-cmd "curl -f http://localhost:7700/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
        ports:
          - 7701:7700

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install PostgreSQL and Redis clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Wait for services to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

          echo "Waiting for MeiliSearch..."
          for i in {1..30}; do
            if curl -f http://localhost:7701/health; then
              echo "MeiliSearch is ready!"
              break
            fi
            echo "Waiting for MeiliSearch... ($i/30)"
            sleep 2
          done

          echo "Waiting for Redis..."
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
              echo "Redis is ready!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/personal_management_test
        run: |
          echo "Running database migrations..."
          uv run alembic upgrade head
          echo "Database migrations completed successfully"

      - name: Run integration tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_NAME: personal_management_test
          MEILISEARCH_URL: http://localhost:7701
          MEILISEARCH_API_KEY: test_master_key
          REDIS_URL: redis://localhost:6379
        run: uv run pytest tests/integration/ -v --tb=short

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm type-check

      - name: Run Prettier check
        run: |
          echo "Running Prettier check..."
          # List files that will be checked
          echo "Files to be checked:"
          find . -name "*.js" -o -name "*.ts" -o -name "*.tsx" -o -name "*.json" -o -name "*.md" | grep -v node_modules | head -10
          # Run prettier check
          pnpm format:check || (echo "Prettier check failed. Running format to see differences..." && pnpm format && exit 1)

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  frontend-e2e-test:
    name: Frontend E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, "Mobile Chrome"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check system resources
        run: |
          echo "🔍 System information:"
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h)"
          echo "Disk space: $(df -h)"
          echo "Docker version: $(docker --version)"
          echo "Docker Compose version: $(docker compose version)"

      - name: Setup Docker environment for e2e tests
        run: |
          echo "🐳 Starting Docker services for e2e tests..."
          docker compose --profile test --env-file .env.test up -d

          echo "📋 Checking Docker services status..."
          docker compose --profile test ps

          echo "📋 Checking Docker service logs for any immediate errors..."
          docker compose --profile test logs --tail=20

          echo "⏳ Waiting for services to be ready..."

          # Wait for backend to be healthy with more detailed logging
          echo "Waiting for backend API..."
          for i in {1..60}; do
            if curl -f -s http://localhost:8001/api/health > /dev/null 2>&1; then
              echo "✅ Backend is ready!"
              break
            fi
            echo "Backend not ready yet... ($i/60)"
            if [ $i -eq 60 ]; then
              echo "❌ Backend failed to start. Checking logs..."
              docker compose --profile test logs backend
              exit 1
            fi
            sleep 5
          done

          # Wait for OAuth provider to be ready
          echo "Waiting for OAuth provider..."
          for i in {1..60}; do
            if curl -f -s http://localhost:4446/health/ready > /dev/null 2>&1; then
              echo "✅ OAuth provider is ready!"
              break
            fi
            echo "OAuth provider not ready yet... ($i/60)"
            if [ $i -eq 60 ]; then
              echo "❌ OAuth provider failed to start. Checking logs..."
              docker compose --profile test logs oauth-provider
              exit 1
            fi
            sleep 5
          done

          # Wait for MeiliSearch to be healthy
          echo "Waiting for MeiliSearch..."
          for i in {1..60}; do
            if curl -f -s http://localhost:7701/health > /dev/null 2>&1; then
              echo "✅ MeiliSearch is ready!"
              break
            fi
            echo "MeiliSearch not ready yet... ($i/60)"
            if [ $i -eq 60 ]; then
              echo "❌ MeiliSearch failed to start. Checking logs..."
              docker compose --profile test logs meilisearch
              exit 1
            fi
            sleep 5
          done

          # OAuth initialization is handled automatically by Docker Compose dependencies
          # The backend service depends on oauth-init with condition: service_completed_successfully
          # So if the backend is healthy, oauth-init must have completed successfully
          echo "✅ OAuth initialization is handled by Docker Compose dependencies"

          echo "🎉 All services are ready for e2e tests!"

          # Final verification - test actual API endpoints
          echo "🔍 Final verification of service endpoints..."

          echo "Testing backend health..."
          curl -f -s http://localhost:8001/api/health || (echo "❌ Backend health check failed" && exit 1)
          echo "✅ Backend health check passed"

          echo "Testing OAuth provider health..."
          curl -f -s http://localhost:4446/health/ready || (echo "❌ OAuth provider health check failed" && exit 1)
          echo "✅ OAuth provider health check passed"

          echo "Testing MeiliSearch health..."
          curl -f -s http://localhost:7701/health || (echo "❌ MeiliSearch health check failed" && exit 1)
          echo "✅ MeiliSearch health check passed"

          echo "Testing OAuth client configuration..."
          curl -f -s http://localhost:4447/admin/clients/test-client-id > /dev/null || (echo "❌ OAuth client not found" && exit 1)
          echo "✅ OAuth client configuration verified"

          echo "✅ All service endpoints verified and ready for testing!"

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: |
          # Install chromium for global setup (always needed) plus the target browser
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            pnpm exec playwright install --with-deps chromium firefox
          elif [ "${{ matrix.browser }}" = "Mobile Chrome" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run Playwright tests
        working-directory: ./frontend
        timeout-minutes: 30  # Prevent hanging indefinitely
        env:
          CI: true
          CLEANUP_AFTER_TESTS: true
        run: pnpm exec playwright test --project="${{ matrix.browser }}"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Cleanup Docker environment
        if: always()
        run: |
          echo "🧹 Cleaning up Docker environment..."
          docker compose --profile test down --volumes --remove-orphans
          echo "✅ Cleanup complete"

