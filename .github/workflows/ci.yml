name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "26"
  UV_VERSION: "0.11.15"
  PNPM_VERSION: "11.7.0"

jobs:
  # Detect which files have changed to conditionally run jobs
  changes:
    runs-on: ubuntu-latest
    # Required permissions for pull requests
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      core_shared: ${{ steps.filter.outputs.core_shared }}
      frontend: ${{ steps.filter.outputs.frontend }}
      worker_google: ${{ steps.filter.outputs.worker_google }}
      worker_immich: ${{ steps.filter.outputs.worker_immich }}
      worker_snipeit: ${{ steps.filter.outputs.worker_snipeit }}
      worker_strava: ${{ steps.filter.outputs.worker_strava }}
      workers: ${{ steps.set-matrix.outputs.workers }}
      run_workers: ${{ steps.set-matrix.outputs.run_workers }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**/*.py'
              - 'backend/**/*.toml'
              - 'backend/**/uv.lock'
              - 'backend/**/Dockerfile*'
              - 'backend/**/docker-compose*.yml'
              - 'backend/**/docker-compose*.yaml'
              - 'core_shared/**/*.py'
              - 'core_shared/**/*.toml'
              - 'core_shared/**/uv.lock'
              - 'core_shared/**/Dockerfile*'
              - 'core_shared/**/docker-compose*.yml'
              - 'core_shared/**/docker-compose*.yaml'
            worker_google:
              - 'integration_workers/google/**/*.py'
              - 'integration_workers/google/**/*.toml'
              - 'integration_workers/google/**/uv.lock'
              - 'integration_workers/google/**/Dockerfile*'
              - 'integration_workers/google/**/docker-compose*.yml'
              - 'integration_workers/google/**/docker-compose*.yaml'
              - 'ruff.toml'
              - 'mypy.ini'
              - 'pytest.ini'
            worker_snipeit:
              - 'integration_workers/snipeit/**/*.py'
              - 'integration_workers/snipeit/**/*.toml'
              - 'integration_workers/snipeit/**/uv.lock'
              - 'integration_workers/snipeit/**/Dockerfile*'
              - 'integration_workers/snipeit/**/docker-compose*.yml'
              - 'integration_workers/snipeit/**/docker-compose*.yaml'
              - 'ruff.toml'
              - 'mypy.ini'
              - 'pytest.ini'
            worker_immich:
              - 'integration_workers/immich/**/*.py'
              - 'integration_workers/immich/**/*.toml'
              - 'integration_workers/immich/**/uv.lock'
              - 'integration_workers/immich/**/Dockerfile*'
              - 'integration_workers/immich/**/docker-compose*.yml'
              - 'integration_workers/immich/**/docker-compose*.yaml'
              - 'ruff.toml'
              - 'mypy.ini'
              - 'pytest.ini'
            worker_strava:
              - 'integration_workers/strava/**/*.py'
              - 'integration_workers/strava/**/*.toml'
              - 'integration_workers/strava/**/uv.lock'
              - 'integration_workers/strava/**/Dockerfile*'
              - 'integration_workers/strava/**/docker-compose*.yml'
              - 'integration_workers/strava/**/docker-compose*.yaml'
              - 'ruff.toml'
              - 'mypy.ini'
              - 'pytest.ini'
            core_shared:
              - 'core_shared/**/*.py'
              - 'core_shared/**/*.toml'
            frontend:
              - 'frontend/**/*.ts'
              - 'frontend/**/*.tsx'
              - 'frontend/**/*.js'
              - 'frontend/**/*.jsx'
              - 'frontend/**/*.json'
      - name: Set matrix for workers
        id: set-matrix
        run: |
          workers="["
          comma=""

          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "workflow_call" ] || [ "${{ steps.filter.outputs.core_shared }}" == "true" ]; then
            workers="[\"google\", \"immich\", \"snipeit\", \"strava\"]"
          else
            if [ "${{ steps.filter.outputs.worker_google }}" == "true" ]; then
              workers="$workers$comma\"google\""
              comma=","
            fi
            if [ "${{ steps.filter.outputs.worker_immich }}" == "true" ]; then
              workers="$workers$comma\"immich\""
              comma=","
            fi
            if [ "${{ steps.filter.outputs.worker_snipeit }}" == "true" ]; then
              workers="$workers$comma\"snipeit\""
              comma=","
            fi
            if [ "${{ steps.filter.outputs.worker_strava }}" == "true" ]; then
              workers="$workers$comma\"strava\""
              comma=","
            fi
            workers="$workers]"
          fi

          if [ "$workers" == "[]" ]; then
            echo "workers=[]" >> $GITHUB_OUTPUT
            echo "run_workers=false" >> $GITHUB_OUTPUT
          else
            echo "workers=$workers" >> $GITHUB_OUTPUT
            echo "run_workers=true" >> $GITHUB_OUTPUT
          fi

  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: ./backend
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run Ruff (linting)
        run: uv run ruff check .

      - name: Run Ruff (formatting check)
        run: uv run ruff format --check .

      - name: Run MyPy (type checking)
        run: uv run mypy .

  core-shared-lint:
    name: Core Shared Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core_shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-core-shared-${{ hashFiles('core_shared/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-core-shared-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy .

  backend-unit-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: ./backend
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          TESTING: true
        run: uv run pytest -m unit --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./backend/coverage.xml
          flags: backend-unit
          name: backend-unit-coverage

  core-shared-unit-test:
    name: Core Shared Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core_shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-core-shared-${{ hashFiles('core_shared/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-core-shared-

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Run unit tests
        run: uv run pytest --cov=core_shared --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./core_shared/coverage.xml
          flags: core-shared-unit
          name: core-shared-unit-coverage

  worker-lint:
    name: Worker Lint & Type Check (${{ matrix.worker }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_workers == 'true'
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.workers) }}
    defaults:
      run:
        working-directory: ./integration_workers/${{ matrix.worker }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy --config-file ../../mypy.ini .

  worker-unit-test:
    name: Worker Unit Tests (${{ matrix.worker }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_workers == 'true'
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.workers) }}
    defaults:
      run:
        working-directory: ./integration_workers/${{ matrix.worker }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest -c ../../pytest.ini --rootdir . tests/unit/ -v --tb=short

  worker-integration-test:
    name: Worker Integration Tests (${{ matrix.worker }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_workers == 'true'
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.workers) }}
    defaults:
      run:
        working-directory: ./integration_workers/${{ matrix.worker }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: personal_management_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/personal_management_test
        run: |
          echo "Installing backend dependencies for migrations..."
          uv sync
          echo "Running database migrations..."
          uv run alembic upgrade head
          echo "Database migrations completed successfully"

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/personal_management_test
          REDIS_URL: redis://localhost:6379
          GOOGLE_CLIENT_ID: test_client_id
          GOOGLE_CLIENT_SECRET: test_client_secret
          ENCRYPTION_KEY: test_encryption_key_32_characters_long_for_testing
        run: |
          if [ -d "tests/integration" ]; then
            uv run pytest -c ../../pytest.ini --rootdir . tests/integration/ -v --tb=short
          else
            echo "No integration tests found for this worker. Skipping."
          fi

  backend-integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: ./backend
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'push' ||
      needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: personal_management_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      meilisearch:
        image: getmeili/meilisearch:v1.38
        env:
          MEILI_MASTER_KEY: test_master_key
          MEILI_ENV: development
          MEILI_LOG_LEVEL: INFO
          MEILI_NO_ANALYTICS: true
        options: >-
          --health-cmd "curl -f http://localhost:7700/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
        ports:
          - 7701:7700

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Cache UV dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install PostgreSQL and Redis clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[dev]

      - name: Wait for services to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

          echo "Waiting for MeiliSearch..."
          for i in {1..30}; do
            if curl -f http://localhost:7701/health; then
              echo "MeiliSearch is ready!"
              break
            fi
            echo "Waiting for MeiliSearch... ($i/30)"
            sleep 2
          done

          echo "Waiting for Redis..."
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
              echo "Redis is ready!"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/personal_management_test
        run: |
          echo "Running database migrations..."
          uv run alembic upgrade head
          echo "Database migrations completed successfully"

      - name: Run integration tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_NAME: personal_management_test
          MEILISEARCH_URL: http://localhost:7701
          MEILISEARCH_API_KEY: test_master_key
          REDIS_URL: redis://localhost:6379
        run: uv run pytest tests/integration/ -v --tb=short

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm type-check

      - name: Run Prettier check
        run: |
          echo "Running Prettier check..."
          # List files that will be checked
          echo "Files to be checked:"
          find . -name "*.js" -o -name "*.ts" -o -name "*.tsx" -o -name "*.json" -o -name "*.md" | grep -v node_modules | head -10
          # Run prettier check
          pnpm format:check || (echo "Prettier check failed. Running format to see differences..." && pnpm format && exit 1)

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  # ==========================================================================
  # E2E TEST INFRASTRUCTURE
  # Pre-build Docker images once and cache Playwright browsers to avoid
  # redundant work across the 3-browser matrix.
  # ==========================================================================

  e2e-docker-build:
    name: E2E Docker Image Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, changes]
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_call' ||
       needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.core_shared == 'true' ||
       needs.changes.outputs.frontend == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Use the 'docker' driver so built images are stored in the local
          # Docker daemon and can be exported as tarballs for the e2e matrix.
          driver: docker

      - name: Build Docker images for e2e tests
        run: |
          echo "🐳 Building all Docker images (python-base built first via additional_contexts)..."
          docker compose --profile test --env-file .env.test build

          echo "📦 Listing built images..."
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Pull remaining Docker images
        run: |
          echo "🐳 Pulling base images used by docker-compose..."
          docker compose --profile test --env-file .env.test pull --ignore-buildable

      - name: Export Docker images as tarball
        run: |
          echo "📦 Exporting all e2e Docker images..."
          # Get all image names from the test profile (python-base is included
          # automatically via additional_contexts build dependencies)
          IMAGES=$(docker compose --profile test --env-file .env.test config --images | sort -u)
          echo "Images to export:"
          echo "$IMAGES"
          docker save $IMAGES | gzip > /tmp/e2e-docker-images.tar.gz
          echo "📦 Tarball size: $(du -h /tmp/e2e-docker-images.tar.gz | cut -f1)"

      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v7
        with:
          name: e2e-docker-images
          path: /tmp/e2e-docker-images.tar.gz
          retention-days: 1
          compression-level: 0  # Already gzipped

  frontend-e2e-test:
    name: Frontend E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [e2e-docker-build]
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, "Mobile Chrome"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      # ── Playwright browser caching ──────────────────────────────────────
      - name: Get Playwright version
        id: pw-version
        working-directory: ./frontend
        run: |
          PW_VERSION=$(pnpm exec playwright --version | awk '{print $2}')
          echo "version=$PW_VERSION" >> $GITHUB_OUTPUT
          echo "Playwright version: $PW_VERSION"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: |
          echo "📥 Cache miss — installing ALL Playwright browsers with OS deps..."
          # Install all browsers so any matrix entry can populate the shared cache
          pnpm exec playwright install --with-deps chromium firefox

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./frontend
        run: |
          echo "✅ Cache hit — installing only OS-level dependencies..."
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            pnpm exec playwright install-deps chromium firefox
          else
            pnpm exec playwright install-deps chromium
          fi

      # ── Docker image loading ────────────────────────────────────────────
      - name: Download pre-built Docker images
        uses: actions/download-artifact@v8
        with:
          name: e2e-docker-images
          path: /tmp

      - name: Load Docker images
        run: |
          echo "📦 Loading pre-built Docker images..."
          docker load < /tmp/e2e-docker-images.tar.gz
          echo "✅ Images loaded:"
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          rm -f /tmp/e2e-docker-images.tar.gz

      - name: Setup Docker environment for e2e tests
        run: |
          echo "🐳 Starting Docker services for e2e tests..."
          docker compose --profile test --env-file .env.test up -d

          echo "📋 Checking Docker services status..."
          docker compose --profile test ps

          echo "📋 Checking Docker service logs for any immediate errors..."
          docker compose --profile test logs --tail=20

          echo "⏳ Waiting for services to be ready..."

          # Wait for backend to be healthy with more detailed logging
          echo "Waiting for backend API..."
          for i in {1..60}; do
            if curl -f -s http://localhost:8001/api/health > /dev/null 2>&1; then
              echo "✅ Backend is ready!"
              break
            fi
            echo "Backend not ready yet... ($i/60)"
            if [ $i -eq 60 ]; then
              echo "❌ Backend failed to start. Checking logs..."
              docker compose --profile test logs backend
              exit 1
            fi
            sleep 5
          done

          # Wait for OAuth provider to be ready
          echo "Waiting for OAuth provider..."
          for i in {1..60}; do
            if curl -f -s http://localhost:4446/health/ready > /dev/null 2>&1; then
              echo "✅ OAuth provider is ready!"
              break
            fi
            echo "OAuth provider not ready yet... ($i/60)"
            if [ $i -eq 60 ]; then
              echo "❌ OAuth provider failed to start. Checking logs..."
              docker compose --profile test logs oauth-provider
              exit 1
            fi
            sleep 5
          done

          # Wait for MeiliSearch to be healthy
          echo "Waiting for MeiliSearch..."
          for i in {1..60}; do
            if curl -f -s http://localhost:7701/health > /dev/null 2>&1; then
              echo "✅ MeiliSearch is ready!"
              break
            fi
            echo "MeiliSearch not ready yet... ($i/60)"
            if [ $i -eq 60 ]; then
              echo "❌ MeiliSearch failed to start. Checking logs..."
              docker compose --profile test logs meilisearch
              exit 1
            fi
            sleep 5
          done

          # OAuth initialization is handled automatically by Docker Compose dependencies
          # The backend service depends on oauth-init with condition: service_completed_successfully
          # So if the backend is healthy, oauth-init must have completed successfully
          echo "✅ OAuth initialization is handled by Docker Compose dependencies"

          echo "🎉 All services are ready for e2e tests!"

          # Final verification - test actual API endpoints
          echo "🔍 Final verification of service endpoints..."

          echo "Testing backend health..."
          curl -f -s http://localhost:8001/api/health || (echo "❌ Backend health check failed" && exit 1)
          echo "✅ Backend health check passed"

          echo "Testing OAuth provider health..."
          curl -f -s http://localhost:4446/health/ready || (echo "❌ OAuth provider health check failed" && exit 1)
          echo "✅ OAuth provider health check passed"

          echo "Testing MeiliSearch health..."
          curl -f -s http://localhost:7701/health || (echo "❌ MeiliSearch health check failed" && exit 1)
          echo "✅ MeiliSearch health check passed"

          echo "Testing OAuth client configuration..."
          curl -f -s http://localhost:4447/admin/clients/test-client-id > /dev/null || (echo "❌ OAuth client not found" && exit 1)
          echo "✅ OAuth client configuration verified"

          echo "✅ All service endpoints verified and ready for testing!"

      - name: Run Playwright tests
        working-directory: ./frontend
        # The suite runs serially (workers: 1) and the firefox project alone
        # takes ~22-33 min, so 30 min left no headroom and tipped over whenever a
        # flaky retry added time. Genuine hangs are still caught by the 3-minute
        # per-test timeout in playwright.config.ts.
        timeout-minutes: 45
        env:
          CI: true
          CLEANUP_AFTER_TESTS: true
        run: pnpm exec playwright test --project="${{ matrix.browser }}"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Cleanup Docker environment
        if: always()
        run: |
          echo "🧹 Cleaning up Docker environment..."
          docker compose --profile test down --volumes --remove-orphans
          echo "✅ Cleanup complete"

