name: Relock core_shared dependents

# The backend and worker uv.lock files record core_shared's requirements, so a
# Dependabot PR that changes core_shared/pyproject.toml leaves those five locks
# stale. Dependabot only relocks the directory it bumps, and every install uses
# `--locked`, so CI on such a PR fails. This job relocks every project with
# scripts/relock-python.sh and pushes the result to the Dependabot branch.
#
# The push uses a GitHub App token, because a push made with GITHUB_TOKEN would
# not trigger CI on the new head. Runs triggered by Dependabot can read only
# Dependabot secrets, so the App's id and key are stored there. Setup and
# failure modes: docs/ci-cd-setup.md#relocking-core_shared-dependents
#
# Only Dependabot's own same-repo PRs run the job. Human PRs (relocked by the
# uv-lock-python pre-commit hook) and stacked PRs never do, and the job's own
# push re-triggers this workflow with the App as actor, so that run is skipped.

on:
  pull_request:
    branches: [main]
    paths:
      - 'core_shared/pyproject.toml'

permissions:
  contents: read

concurrency:
  group: relock-dependents-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  relock:
    name: Relock core_shared dependents
    runs-on: ubuntu-latest
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Require the relock App credentials
        env:
          APP_ID: ${{ secrets.RELOCK_APP_ID }}
          APP_KEY: ${{ secrets.RELOCK_APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$APP_ID" ] || missing+=(RELOCK_APP_ID)
          [ -n "$APP_KEY" ] || missing+=(RELOCK_APP_PRIVATE_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Dependabot secrets: ${missing[*]}. Relock by hand with scripts/relock-python.sh; setup: docs/ci-cd-setup.md#relocking-core_shared-dependents"
            exit 1
          fi

      - name: Create the relock App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELOCK_APP_ID }}
          private-key: ${{ secrets.RELOCK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the Dependabot branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install UV
        # Pinned to a commit: third-party action (Dependabot keeps the pin current).
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Keep in step with UV_VERSION in ci.yml.
          version: "0.11.15"

      - name: Relock every uv project
        id: relock
        run: |
          if scripts/relock-python.sh 2>&1 | tee "$RUNNER_TEMP/relock.log"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash -o pipefail {0}

      - name: Explain the unresolvable relock on the PR
        if: steps.relock.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "This PR changes \`core_shared/pyproject.toml\`, but at least one project that depends on core_shared can't be relocked against it."
            echo "This usually means a worker's \`==\` pin conflicts with the new requirement, and that pin needs to be bumped by hand."
            echo "After bumping it, run \`scripts/relock-python.sh\` and push the locks."
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/relock.log"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          echo "::error::Relock failed; see the PR comment and the log above"
          exit 1

      - name: Commit and push the relocked dependents
        if: steps.relock.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet -- '*uv.lock'; then
            echo "Every lock already matches; nothing to push."
            exit 0
          fi
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          git add -- '*uv.lock'
          git commit -m "chore(deps): relock core_shared dependents"
          git push
