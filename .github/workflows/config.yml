# Configuration file for GitHub Actions workflows
# This file contains reusable configuration that can be referenced by other workflows

name: Workflow Configuration

# This workflow doesn't run automatically - it's just for configuration
on:
  workflow_call:
    outputs:
      python-version:
        description: "Python version to use"
        value: "3.11"
      node-version:
        description: "Node.js version to use"
        value: "24"
      uv-version:
        description: "UV version to use"
        value: "0.4.18"
      pnpm-version:
        description: "PNPM version to use"
        value: "11.0.4"

# Environment variables that can be used across workflows
env:
  # Python configuration
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.4.18"

  # Node.js configuration
  NODE_VERSION: "24"
  PNPM_VERSION: "11.0.4"

  # Testing configuration
  PYTEST_ARGS: "--cov=app --cov-report=xml --cov-report=term-missing"
  JEST_ARGS: "--coverage --watchAll=false"

  # Linting configuration
  RUFF_ARGS: "check ."
  BLACK_ARGS: "--check ."
  MYPY_ARGS: "."
  ESLINT_ARGS: "--ext .ts,.tsx,.js,.jsx"

  # Docker configuration
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ env.PYTHON_VERSION }}
      node-version: ${{ env.NODE_VERSION }}
      uv-version: ${{ env.UV_VERSION }}
      pnpm-version: ${{ env.PNPM_VERSION }}
    steps:
      - name: Output configuration
        run: |
          echo "Python version: ${{ env.PYTHON_VERSION }}"
          echo "Node.js version: ${{ env.NODE_VERSION }}"
          echo "UV version: ${{ env.UV_VERSION }}"
          echo "PNPM version: ${{ env.PNPM_VERSION }}"
