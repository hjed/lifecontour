name: Security Scan

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.15"

      # Audit exactly what ships: every project's uv.lock (dev groups and
      # extras included), not a fresh resolution of pyproject.toml.
      # `uv export --locked` fails if a lock is stale, and the hashed export
      # lets pip-audit skip pip's own resolver.
      - name: Run pip-audit on every locked project
        run: |
          status=0
          for project in backend core_shared integration_workers/google integration_workers/immich integration_workers/snipeit integration_workers/strava; do
            requirements="$RUNNER_TEMP/$(basename "$project")-requirements.txt"
            echo "::group::pip-audit $project"
            if ! uv export -q --locked --all-extras --all-groups --no-emit-project \
                --no-emit-package core_shared --directory "$project" -o "$requirements"; then
              status=1
            elif ! uvx pip-audit --disable-pip --progress-spinner=off -r "$requirements"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Run Bandit security linter
        working-directory: ./backend
        run: uvx bandit -r app/ -f json -o bandit-report.json || true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-results
          path: backend/bandit-report.json

  frontend-security:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.7.0"

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level moderate

      - name: Run ESLint security rules
        run: |
          pnpm add -D eslint-plugin-security
          pnpm lint
