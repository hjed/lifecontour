version: '3.8'

services:
  # PostgreSQL Database
  postgres-dev:
    image: postgres:15-alpine
    container_name: pms-postgres-dev
    environment:
      POSTGRES_DB: personal_management_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/database/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d personal_management_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pms-dev

  # MeiliSearch Search Engine
  meilisearch-dev:
    image: getmeili/meilisearch:v1.2
    container_name: pms-meilisearch-dev
    environment:
      - MEILI_MASTER_KEY=dev_master_key_change_in_production
      - MEILI_ENV=development
      - MEILI_LOG_LEVEL=INFO
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_dev_data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pms-dev

  # Jaeger - OpenTelemetry Collector and UI
  jaeger-dev:
    image: jaegertracing/all-in-one:1.52
    container_name: pms-jaeger-dev
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "14250:14250"  # Jaeger collector gRPC
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "9411:9411"    # Zipkin compatible endpoint
    networks:
      - pms-dev

  # Simple OAuth2 Provider for Testing (SQLite In-Memory)
  oauth-provider-dev:
    image: oryd/hydra:v2.2.0
    container_name: pms-oauth-dev
    environment:
      # Use SQLite in-memory database
      - DSN=sqlite://file::memory:?cache=shared
      - URLS_SELF_ISSUER=http://localhost:4444
      - URLS_CONSENT=http://localhost:3001/consent
      - URLS_LOGIN=http://localhost:3001/login
      - SECRETS_SYSTEM=this-is-a-dev-secret-change-in-production
      - OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES=public,pairwise
      - OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT=some-random-salt
      - LOG_LEVEL=debug
      - SERVE_COOKIES_SAME_SITE_MODE=Lax
      - SERVE_COOKIES_SAME_SITE_LEGACY_WORKAROUND=true
    volumes:
      - ./docker/oauth-provider/hydra.yml:/etc/config/hydra/hydra.yml:ro
    ports:
      - "4444:4444"  # Public port
      - "4445:4445"  # Admin port
    networks:
      - pms-dev
    command: ["serve", "-c", "/etc/config/hydra/hydra.yml", "all", "--dev"]

  # OAuth Client Initializer
  oauth-init-dev:
    image: curlimages/curl:latest
    container_name: pms-oauth-init-dev
    networks:
      - pms-dev
    depends_on:
      - oauth-provider-dev
    volumes:
      - ./docker/oauth-provider/init-oauth.sh:/init-oauth.sh:ro
    environment:
      - OAUTH_PROVIDER_HOST=oauth-provider-dev
      - OAUTH_ADMIN_PORT=4445
      - CLIENT_ID=dev-client-id
      - CLIENT_SECRET=dev-client-secret
      - ENVIRONMENT=development
      - FRONTEND_URL=http://localhost:3000
      - PUBLIC_PORT=4444
      - ADMIN_PORT_EXTERNAL=4445
    entrypoint: ["/bin/sh"]
    command: ["/init-oauth.sh"]
    restart: "no"

  # OAuth Provider UI (for managing clients and users)
  oauth-ui-dev:
    image: node:18-alpine
    container_name: pms-oauth-ui-dev
    working_dir: /app
    volumes:
      - ./docker/oauth-ui:/app
    ports:
      - "3001:3001"
    environment:
      - HYDRA_ADMIN_URL=http://oauth-provider-dev:4445
      - PORT=3001
    depends_on:
      - oauth-provider-dev
    networks:
      - pms-dev
    command: sh -c "npm install && npm start"



  # Google Contacts Integration Worker (Development)
  google-contacts-worker-dev:
    build:
      context: .
      dockerfile: integration_workers/google_contacts/Dockerfile
    container_name: pms-google-worker-dev
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres-dev:5432/personal_management_dev
      REDIS_URL: redis://redis-dev:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dev-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dev-google-client-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-change-in-production}
      LOG_LEVEL: DEBUG
      WORKER_ID: google-contacts-worker-dev
      MAX_CONCURRENT_JOBS: 3
    volumes:
      - ./core_shared:/core_shared:ro
      - ./integration_workers/google_contacts:/app
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    networks:
      - pms-dev
    restart: unless-stopped

  # Redis for ARQ Task Queue (Development)
  redis-dev:
    image: redis:7-alpine
    container_name: pms-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pms-dev

  # Backend (Development Mode with Hot Reload)
  backend-dev:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        BUILD_ENV: development
        INSTALL_DEV_DEPS: "true"
    container_name: pms-backend-dev
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres-dev:5432/personal_management_dev
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://frontend-dev:3000"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend-dev,*"
      MEILISEARCH_URL: http://meilisearch-dev:7700
      MEILISEARCH_API_KEY: dev_master_key_change_in_production
      SESSION_SECRET_KEY: dev_session_secret_change_in_production
      SEARCH_INDEX_PREFIX: pms_dev_
      REDIS_URL: redis://redis-dev:6379
      ENABLE_TELEMETRY: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger-dev:4318
      OTEL_SERVICE_NAME: personal-management-backend-dev
      OTEL_RESOURCE_ATTRIBUTES: "service.name=personal-management-backend-dev,service.version=0.1.0-dev"
      # OAuth Configuration for testing
      OAUTH_PROVIDER_NAME: generic
      OAUTH_CLIENT_ID: dev-client-id
      OAUTH_CLIENT_SECRET: dev-client-secret
      OAUTH_AUTHORIZATION_URL: http://localhost:4444/oauth2/auth
      OAUTH_TOKEN_URL: http://oauth-provider-dev:4444/oauth2/token
      OAUTH_USERINFO_URL: http://oauth-provider-dev:4444/userinfo
      # Enable OAuth for proper testing
      DISABLE_AUTH: "false"
    volumes:
      - ./backend:/app
      - backend_dev_cache:/app/.cache
    ports:
      - "8000:8000"
    depends_on:
      postgres-dev:
        condition: service_healthy
      meilisearch-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      jaeger-dev:
        condition: service_started
      oauth-provider-dev:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pms-dev
    restart: unless-stopped
    command: ["/start-dev.sh"]

  # Frontend (Development Mode with Hot Reload)
  frontend-dev:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILD_ENV: development
        NODE_ENV: development
    container_name: pms-frontend-dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_OAUTH_PROVIDER_URL=http://localhost:4444
      - BACKEND_URL=http://backend-dev:8000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - frontend_dev_modules:/app/node_modules
      - frontend_dev_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend-dev:
        condition: service_healthy
    networks:
      - pms-dev
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
  meilisearch_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  backend_dev_cache:
    driver: local
  frontend_dev_modules:
    driver: local
  frontend_dev_next:
    driver: local

networks:
  pms-dev:
    driver: bridge
    name: personal-management-dev
