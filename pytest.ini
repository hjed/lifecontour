# Shared pytest configuration for the integration workers
# (integration_workers/{google,immich,strava,snipeit}).
#
# pytest has no config inheritance in pyproject.toml. Each worker consumes this
# file explicitly from its own directory, pinning rootdir back to the worker so
# node IDs stay worker-relative:
#
#     uv run pytest -c ../../pytest.ini --rootdir . tests/unit/
#     uv run pytest -c ../../pytest.ini --rootdir . tests/integration/

[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --strict-config --verbose
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    asyncio: marks tests as async tests
