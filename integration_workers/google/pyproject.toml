[project]
name = "google-worker"
version = "0.1.0"
description = "Google Contacts Integration Worker for Personal Management System"
authors = [
    {name = "Personal Management System", email = "dev@example.com"}
]
license = {text = "AGPL-3.0"}
requires-python = ">=3.14"
dependencies = [
    # Core shared package
    "core_shared",

    # ARQ for task queue
    "arq==0.28.0",

    # Google API client libraries
    "google-api-python-client==2.197.0",
    "google-auth-httplib2==0.4.0",
    "google-auth-oauthlib==1.4.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg==0.31.0",

    # HTTP client
    "httpx==0.28.1",

    # Logging and monitoring
    "structlog==25.5.0",

    # Configuration
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",

    # Encryption
    "cryptography>=48.0.0",

    # Redis client (compatible with ARQ)
    "redis[hiredis]>=8.0.0",
]

[tool.uv.sources]
core_shared = { path = "../../core_shared", editable = true }

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff>=0.15.16",
    "mypy>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
extend = "../../ruff.toml"
target-version = "py312"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = ["B011", "DTZ"]
"tests/**/conftest.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
plugins = [
    "pydantic.mypy"
]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true


[[tool.mypy.overrides]]
module = [
    "google.*",
    "googleapiclient.*",
    "redis.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "asyncio: marks tests as async tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]






[tool.uv]
override-dependencies = ["redis>=8.0.0"]

