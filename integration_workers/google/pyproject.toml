[project]
name = "google-worker"
version = "0.1.0"
description = "Google Contacts Integration Worker for Personal Management System"
authors = [
    {name = "Personal Management System", email = "dev@example.com"}
]
license = {text = "AGPL-3.0"}
requires-python = ">=3.12"
dependencies = [
    # Core shared package
    "core_shared",

    # ARQ for task queue
    "arq==0.26.0",

    # Google API client libraries
    "google-api-python-client==2.192.0",
    "google-auth-httplib2==0.3.0",
    "google-auth-oauthlib==1.3.0",

    # Database
    "sqlalchemy[asyncio]==2.0.48",
    "asyncpg==0.31.0",

    # HTTP client
    "httpx==0.25.2",

    # Logging and monitoring
    "structlog==23.2.0",

    # Configuration
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",

    # Encryption
    "cryptography>=42.0.0",

    # Redis client (compatible with ARQ)
    "redis[hiredis]>=4.2.0,<5.0.0",
]

[tool.uv.sources]
core_shared = { path = "../../core_shared", editable = true }

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==1.3.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Use spaces around the equals sign
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Automatically detect line ending
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "arq.*",
    "google.*",
    "googleapiclient.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "asyncio: marks tests as async tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

