[project]
name = "google-worker"
version = "0.1.0"
description = "Google Contacts Integration Worker for Personal Management System"
authors = [
    {name = "Personal Management System", email = "dev@example.com"}
]
license = {text = "AGPL-3.0"}
requires-python = ">=3.14"
dependencies = [
    # Core shared package
    "core_shared",

    # ARQ for task queue
    "arq==0.28.0",

    # Google API client libraries
    "google-api-python-client==2.198.0",
    "google-auth-httplib2==0.4.1",
    "google-auth-oauthlib==1.4.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg==0.31.0",

    # HTTP client
    "httpx==0.28.1",

    # Logging and monitoring
    "structlog==26.1.0",

    # Configuration
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",

    # Encryption
    "cryptography>=50.0.0",

    # Redis client (compatible with ARQ)
    "redis[hiredis]>=8.1.0",
]

[tool.uv.sources]
core_shared = { path = "../../core_shared", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
extend = "../../ruff.toml"
target-version = "py312"

# ruff per-file-ignores globs are anchored to this config file's directory, so
# the worker restates its test-dir ignores (the root ruff.toml patterns are
# anchored to the repo root and do not match the worker's tests/).
[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = ["B011", "DTZ"]
"tests/**/conftest.py" = ["E402"]
"tests/conftest.py" = ["E402"]

# Tooling config (mypy, pytest, coverage) is shared once at the repo root:
#   ruff.toml (via extend above), mypy.ini, pytest.ini.
# Workers consume mypy.ini/pytest.ini via explicit CLI flags — see
# docs/code-quality-standards.md.

[tool.uv]
override-dependencies = ["redis>=8.0.0"]

