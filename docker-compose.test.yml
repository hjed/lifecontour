version: '3.8'

services:
  # PostgreSQL Database for testing
  database-test:
    image: postgres:15-alpine
    container_name: pms-postgres-test
    environment:
      POSTGRES_DB: personal_management_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/database/init-test.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_management_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - personal-management-test

  # MeiliSearch for testing
  meilisearch-test:
    image: getmeili/meilisearch:v1.2
    container_name: pms-meilisearch-test
    environment:
      - MEILI_MASTER_KEY=test_search_key
      - MEILI_ENV=development
      - MEILI_LOG_LEVEL=WARN
    ports:
      - "7701:7700"  # Different port to avoid conflicts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - personal-management-test

  # Redis for testing
  redis-test:
    image: redis:7-alpine
    container_name: pms-redis-test
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - personal-management-test

  # Simple OAuth2 Provider for Testing (SQLite In-Memory)
  oauth-provider-test:
    image: oryd/hydra:v2.2.0
    container_name: pms-oauth-test
    environment:
      # Use SQLite in-memory database for tests (faster and isolated)
      - DSN=sqlite://file::memory:?cache=shared
      - URLS_SELF_ISSUER=http://localhost:4446
      - URLS_CONSENT=http://localhost:3002/consent
      - URLS_LOGIN=http://localhost:3002/login
      - URLS_LOGOUT=http://localhost:3002/logout
      - SECRETS_SYSTEM=test-system-secret-change-in-production
      - OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT=test-salt-change-in-production
      - LOG_LEVEL=debug
      - SERVE_COOKIES_SAME_SITE_MODE=Lax
      - SERVE_COOKIES_SAME_SITE_LEGACY_WORKAROUND=true
    volumes:
      - ./docker/oauth-provider/hydra.yml:/etc/config/hydra/hydra.yml:ro
    ports:
      - "4446:4444"  # Different port to avoid conflicts
      - "4447:4445"  # Different port to avoid conflicts
    networks:
      - personal-management-test
    command: ["serve", "-c", "/etc/config/hydra/hydra.yml", "all", "--dev"]

  # OAuth Client Initializer for Tests
  oauth-init-test:
    image: curlimages/curl:latest
    container_name: pms-oauth-init-test
    networks:
      - personal-management-test
    depends_on:
      - oauth-provider-test
    volumes:
      - ./docker/oauth-provider/init-oauth.sh:/init-oauth.sh:ro
    environment:
      - OAUTH_PROVIDER_HOST=oauth-provider-test
      - OAUTH_ADMIN_PORT=4445
      - CLIENT_ID=test-client-id
      - CLIENT_SECRET=test-client-secret
      - ENVIRONMENT=testing
      - FRONTEND_URL=http://localhost:3000
      - PUBLIC_PORT=4446
      - ADMIN_PORT_EXTERNAL=4447
    entrypoint: ["/bin/sh"]
    command: ["/init-oauth.sh"]
    restart: "no"

  # Backend API for testing
  backend-test:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        BUILD_ENV: development
        INSTALL_DEV_DEPS: "true"
    container_name: pms-backend-test
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database-test:5432/personal_management_test
      # OAuth Configuration for testing
      OAUTH_PROVIDER_NAME: generic
      OAUTH_CLIENT_ID: test-client-id
      OAUTH_CLIENT_SECRET: test-client-secret
      OAUTH_AUTHORIZATION_URL: http://localhost:4446/oauth2/auth
      OAUTH_TOKEN_URL: http://oauth-provider-test:4444/oauth2/token
      OAUTH_USERINFO_URL: http://oauth-provider-test:4444/userinfo
      # Disable auth for easier testing
      DISABLE_AUTH: "false"
      MEILISEARCH_URL: http://meilisearch-test:7700
      MEILISEARCH_API_KEY: test_search_key
      SESSION_SECRET_KEY: test_session_secret_key
      SEARCH_INDEX_PREFIX: test_
      REDIS_URL: redis://redis-test:6379
      ENVIRONMENT: test
    volumes:
      - ./backend:/app
      - ./core_shared:/core_shared
    ports:
      - "8001:8000"  # Different port to avoid conflicts
    depends_on:
      database-test:
        condition: service_healthy
      meilisearch-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      oauth-provider-test:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - personal-management-test

networks:
  personal-management-test:
    driver: bridge

volumes:
  postgres_test_data:
  meilisearch_test_data:
