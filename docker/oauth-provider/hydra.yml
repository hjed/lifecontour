# Hydra Configuration for Development
# This configuration is used for development and testing environments

# Logging
log:
  level: info
  format: json

# Development settings
dev: true

# Serve configuration
serve:
  cookies:
    same_site_mode: Lax
    same_site_legacy_workaround: true
  public:
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:3000
        - http://localhost:3001
        - http://localhost:8000
      allowed_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed_headers:
        - Authorization
        - Content-Type
        - X-Requested-With
      allow_credentials: true

# OAuth2 configuration
oauth2:
  # Allow insecure redirect URIs for development
  expose_internal_errors: true
