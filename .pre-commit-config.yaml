repos:
  # Backend Python hooks
  - repo: local
    hooks:
      # Run the formatter
      - id: ruff-format-backend
        name: ruff format (backend)
        entry: bash -c 'cd backend && uv run ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      # Run the linter
      - id: ruff-backend
        name: ruff check (backend)
        entry: bash -c 'cd backend && uv run ruff check --fix .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

  # Backend type checking
  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

  # Core Shared Python hooks
  - repo: local
    hooks:
      # Run the formatter
      - id: ruff-format-core-shared
        name: ruff format (core_shared)
        entry: bash -c 'cd core_shared && uv run ruff format .'
        language: system
        files: ^core_shared/.*\.py$
        pass_filenames: false
      # Run the linter
      - id: ruff-core-shared
        name: ruff check (core_shared)
        entry: bash -c 'cd core_shared && uv run ruff check --fix .'
        language: system
        files: ^core_shared/.*\.py$
        pass_filenames: false

  # Core Shared type checking
  - repo: local
    hooks:
      - id: mypy-core-shared
        name: mypy (core_shared)
        entry: bash -c 'cd core_shared && uv run mypy .'
        language: system
        files: ^core_shared/.*\.py$
        pass_filenames: false

  # Frontend hooks
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && pnpm format'
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|json|css|scss|md)$
        pass_filenames: false
        require_serial: true

  # Frontend ESLint
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && pnpm lint:fix'
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
        require_serial: true

  # Frontend TypeScript type checking
  - repo: local
    hooks:
      - id: typescript-check
        name: typescript check (frontend)
        entry: bash -c 'cd frontend && pnpm type-check'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^docker/oauth-ui/package-lock\.json$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
