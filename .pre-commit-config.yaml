default_language_version:
  python: python3

repos:
  # Backend Python hooks
  - repo: local
    hooks:
      # Run the formatter
      - id: ruff-format-backend
        name: ruff format (backend)
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      # Run the linter
      - id: ruff-backend
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

  # Backend type checking
  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy (backend)
        entry: uv run --directory backend mypy app/
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

  # Core Shared Python hooks
  - repo: local
    hooks:
      # Run the formatter
      - id: ruff-format-core-shared
        name: ruff format (core_shared)
        entry: uv run --directory core_shared ruff format .
        language: system
        files: ^core_shared/.*\.py$
        pass_filenames: false
      # Run the linter
      - id: ruff-core-shared
        name: ruff check (core_shared)
        entry: uv run --directory core_shared ruff check --fix .
        language: system
        files: ^core_shared/.*\.py$
        pass_filenames: false

  # Core Shared type checking
  - repo: local
    hooks:
      - id: mypy-core-shared
        name: mypy (core_shared)
        entry: uv run --directory core_shared mypy .
        language: system
        files: ^core_shared/.*\.py$
        pass_filenames: false

  # Frontend hooks
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: pnpm --dir frontend format
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|json|css|scss|md)$
        pass_filenames: false
        require_serial: true

  # Frontend ESLint
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: pnpm --dir frontend lint:fix
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
        require_serial: true

  # Frontend TypeScript type checking
  - repo: local
    hooks:
      - id: typescript-check
        name: typescript check (frontend)
        entry: pnpm --dir frontend type-check
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true

  # General hooks
  - repo: local
    hooks:
      - id: check-json
        name: check json
        entry: uvx python3 -c "import sys, json; [json.load(open(f)) for f in sys.argv[1:]]"
        language: system
        files: \.json$
      - id: check-toml
        name: check toml
        entry: uvx python3 -c "import sys, tomllib; [tomllib.load(open(f, 'rb')) for f in sys.argv[1:]]"
        language: system
        files: \.toml$

  # Cross-platform hooks from pre-commit-hooks (Python-based, no bash required)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
