default_language_version:
  python: python3

repos:
  # Backend Python hooks
  - repo: local
    hooks:
      # Run the formatter. Markdown is in the trigger pattern because ruff
      # formats Python code blocks inside `.md` files (ruff >= 0.16), and CI
      # runs `ruff format --check .` over them.
      - id: ruff-format-backend
        name: ruff format (backend)
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.(py|md)$
        pass_filenames: false
      # Run the linter
      - id: ruff-backend
        name: ruff check (backend)
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

  # Backend type checking
  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy (backend)
        entry: uv run --directory backend mypy .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

  # Core Shared Python hooks
  - repo: local
    hooks:
      # Run the formatter
      - id: ruff-format-core-shared
        name: ruff format (core_shared)
        entry: uv run --directory core_shared ruff format .
        language: system
        files: ^core_shared/.*\.(py|md)$
        pass_filenames: false
      # Run the linter
      - id: ruff-core-shared
        name: ruff check (core_shared)
        entry: uv run --directory core_shared ruff check --fix .
        language: system
        files: ^core_shared/.*\.py$
        pass_filenames: false

  # Core Shared type checking
  - repo: local
    hooks:
      - id: mypy-core-shared
        name: mypy (core_shared)
        entry: uv run --directory core_shared mypy .
        language: system
        files: ^core_shared/.*\.py$
        pass_filenames: false

  # Frontend hooks
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: npm run --prefix frontend format
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|json|css|scss|md)$
        pass_filenames: false
        require_serial: true

  # Frontend ESLint
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: npm run --prefix frontend lint:fix
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
        require_serial: true

  # Frontend TypeScript type checking
  - repo: local
    hooks:
      - id: typescript-check
        name: typescript check (frontend)
        entry: npm run --prefix frontend type-check
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true

  # Google Worker Python hooks
  - repo: local
    hooks:
      - id: ruff-format-google-worker
        name: ruff format (google-worker)
        entry: uv run --directory integration_workers/google ruff format .
        language: system
        files: ^integration_workers/google/.*\.(py|md)$
        pass_filenames: false
      - id: ruff-google-worker
        name: ruff check (google-worker)
        entry: uv run --directory integration_workers/google ruff check --fix .
        language: system
        files: ^integration_workers/google/.*\.py$
        pass_filenames: false
      - id: mypy-google-worker
        name: mypy (google-worker)
        entry: uv run --directory integration_workers/google mypy --config-file ../../mypy.ini .
        language: system
        files: ^integration_workers/google/.*\.py$
        pass_filenames: false

  # Strava Worker Python hooks
  - repo: local
    hooks:
      - id: ruff-format-strava-worker
        name: ruff format (strava-worker)
        entry: uv run --directory integration_workers/strava ruff format .
        language: system
        files: ^integration_workers/strava/.*\.(py|md)$
        pass_filenames: false
      - id: ruff-strava-worker
        name: ruff check (strava-worker)
        entry: uv run --directory integration_workers/strava ruff check --fix .
        language: system
        files: ^integration_workers/strava/.*\.py$
        pass_filenames: false
      - id: mypy-strava-worker
        name: mypy (strava-worker)
        entry: uv run --directory integration_workers/strava mypy --config-file ../../mypy.ini .
        language: system
        files: ^integration_workers/strava/.*\.py$
        pass_filenames: false

  # Snipe-IT Worker Python hooks
  - repo: local
    hooks:
      - id: ruff-format-snipeit-worker
        name: ruff format (snipeit-worker)
        entry: uv run --directory integration_workers/snipeit ruff format .
        language: system
        files: ^integration_workers/snipeit/.*\.(py|md)$
        pass_filenames: false
      - id: ruff-snipeit-worker
        name: ruff check (snipeit-worker)
        entry: uv run --directory integration_workers/snipeit ruff check --fix .
        language: system
        files: ^integration_workers/snipeit/.*\.py$
        pass_filenames: false
      - id: mypy-snipeit-worker
        name: mypy (snipeit-worker)
        entry: uv run --directory integration_workers/snipeit mypy --config-file ../../mypy.ini .
        language: system
        files: ^integration_workers/snipeit/.*\.py$
        pass_filenames: false

  # Immich Worker Python hooks
  - repo: local
    hooks:
      - id: ruff-format-immich-worker
        name: ruff format (immich-worker)
        entry: uv run --directory integration_workers/immich ruff format .
        language: system
        files: ^integration_workers/immich/.*\.(py|md)$
        pass_filenames: false
      - id: ruff-immich-worker
        name: ruff check (immich-worker)
        entry: uv run --directory integration_workers/immich ruff check --fix .
        language: system
        files: ^integration_workers/immich/.*\.py$
        pass_filenames: false
      - id: mypy-immich-worker
        name: mypy (immich-worker)
        entry: uv run --directory integration_workers/immich mypy --config-file ../../mypy.ini .
        language: system
        files: ^integration_workers/immich/.*\.py$
        pass_filenames: false

  # General hooks
  - repo: local
    hooks:
      - id: check-json
        name: check json
        entry: uvx python3 -c "import sys, json; [json.load(open(f)) for f in sys.argv[1:]]"
        language: system
        files: \.json$
      - id: check-toml
        name: check toml
        entry: uvx python3 -c "import sys, tomllib; [tomllib.load(open(f, 'rb')) for f in sys.argv[1:]]"
        language: system
        files: \.toml$

  # Secret scanning of staged changes with the committed .gitleaks.toml and
  # .gitleaksignore. Keep rev in step with GITLEAKS_VERSION in ci.yml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Cross-platform hooks from pre-commit-hooks (Python-based, no bash required)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
