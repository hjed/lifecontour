version: '3.8'

# Unified Docker Compose for Personal Management System
# Supports multiple profiles: dev (default), test, test-backend, prod
# Usage:
#   docker compose --env-file .env.dev up                          # dev profile (default)
#   docker compose --profile test --env-file .env.test up          # test profile
#   docker compose --profile test-backend --env-file .env.test up  # backend tests only
#   docker compose --profile prod --env-file .env.prod up          # production
#
# Environment files:
#   .env.dev   - Development configuration (default)
#   .env.test  - Testing configuration
#   .env.prod  - Production configuration

services:
  # ============================================================================
  # CORE SERVICES (all profiles)
  # ============================================================================

  database:
    image: postgres:18-alpine
    container_name: ${CONTAINER_PREFIX:-pms}-postgres
    profiles: [dev, test, test-backend, prod]
    environment:
      POSTGRES_DB: ${DB_NAME:-personal_management}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-personal_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - personal-management

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-pms}-redis
    profiles: [dev, test, test-backend, prod]
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - personal-management

  meilisearch:
    image: getmeili/meilisearch:v1.38
    container_name: ${CONTAINER_PREFIX:-pms}-meilisearch
    profiles: [dev, test, test-backend, prod]
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-dev_master_key_change_in_production}
      - MEILI_ENV=${MEILI_ENV:-development}
      - MEILI_LOG_LEVEL=${MEILI_LOG_LEVEL:-INFO}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILI_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - personal-management

  # ============================================================================
  # DEVELOPMENT SERVICES (dev profile)
  # ============================================================================

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: ${CONTAINER_PREFIX:-pms}-jaeger
    profiles: [dev]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "14250:14250"  # Jaeger collector gRPC
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "9411:9411"    # Zipkin compatible endpoint
    networks:
      - personal-management

  oauth-provider:
    image: oryd/hydra:v25.4.0
    container_name: ${CONTAINER_PREFIX:-pms}-oauth
    profiles: [dev, test, prod]
    user: root
    environment:
      - DSN=${OAUTH_DSN:-sqlite:///data/hydra.sqlite?_fk=true}
      - URLS_SELF_ISSUER=${OAUTH_ISSUER:-http://localhost:4444}
      - URLS_CONSENT=${OAUTH_CONSENT_URL:-http://localhost:3001/consent}
      - URLS_LOGIN=${OAUTH_LOGIN_URL:-http://localhost:3001/login}
      - SECRETS_SYSTEM=${OAUTH_SYSTEM_SECRET:-this-is-a-dev-secret-change-in-production}
      - OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES=public,pairwise
      - OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT=${OAUTH_PAIRWISE_SALT:-some-random-salt}
      - LOG_LEVEL=${OAUTH_LOG_LEVEL:-debug}
      - SERVE_COOKIES_SAME_SITE_MODE=Lax
      - SERVE_COOKIES_SAME_SITE_LEGACY_WORKAROUND=true
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./docker/oauth-provider/hydra.yml:/etc/config/hydra/hydra.yml:ro
      - hydra_data:/data
    ports:
      - "${OAUTH_PUBLIC_PORT:-4444}:4444"
      - "${OAUTH_ADMIN_PORT:-4445}:4445"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4445/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - personal-management
    entrypoint: /bin/sh
    command: -c "hydra migrate sql -e --yes && hydra serve -c /etc/config/hydra/hydra.yml all --dev"

  oauth-login-consent:
    build:
      context: docker/oauth-login-consent
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-pms}-oauth-login-consent
    profiles: [dev, test]
    working_dir: /app
    volumes:
      - ./docker/oauth-login-consent:/app
    ports:
      - "${OAUTH_UI_PORT:-3001}:3001"
    environment:
      - HYDRA_ADMIN_URL=http://${CONTAINER_PREFIX:-pms}-oauth:4445
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - oauth-provider
    networks:
      - personal-management
    command: sh -c "npm install && npm start"

  oauth-init:
    image: curlimages/curl:latest
    container_name: ${CONTAINER_PREFIX:-pms}-oauth-init
    profiles: [dev, test]
    networks:
      - personal-management
    depends_on:
      oauth-provider:
        condition: service_healthy
    volumes:
      - ./docker/oauth-provider/init-oauth.sh:/init-oauth.sh:ro
    environment:
      - OAUTH_PROVIDER_HOST=${CONTAINER_PREFIX:-pms}-oauth
      - OAUTH_ADMIN_PORT=4445
      - CLIENT_ID=${OAUTH_CLIENT_ID:-dev-client-id}
      - CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-dev-client-secret}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PUBLIC_PORT=${OAUTH_PUBLIC_PORT:-4444}
      - ADMIN_PORT_EXTERNAL=${OAUTH_ADMIN_PORT:-4445}
    entrypoint: ["/bin/sh"]
    command: ["/init-oauth.sh"]
    restart: "no"

  # ============================================================================
  # BACKEND SERVICES
  # ============================================================================

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-development}
        INSTALL_DEV_DEPS: ${INSTALL_DEV_DEPS:-true}
    container_name: ${CONTAINER_PREFIX:-pms}-backend
    profiles: [dev, test, prod]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${CONTAINER_PREFIX:-pms}-postgres:5432/${DB_NAME:-personal_management}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,*}
      MEILISEARCH_URL: http://${CONTAINER_PREFIX:-pms}-meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_in_production}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-dev_session_secret_change_in_production}
      SEARCH_INDEX_PREFIX: ${SEARCH_INDEX_PREFIX:-pms_}
      REDIS_URL: redis://${CONTAINER_PREFIX:-pms}-redis:6379
      ENABLE_TELEMETRY: ${ENABLE_TELEMETRY:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-personal-management-backend}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.name=personal-management-backend,service.version=0.1.0}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME:-generic}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-dev-client-id}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-dev-client-secret}
      OAUTH_AUTHORIZATION_URL: ${OAUTH_AUTHORIZATION_URL:-http://localhost:4444/oauth2/auth}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-http://${CONTAINER_PREFIX:-pms}-oauth:4444/oauth2/token}
      OAUTH_USERINFO_URL: ${OAUTH_USERINFO_URL:-http://${CONTAINER_PREFIX:-pms}-oauth:4444/userinfo}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:8000}
      DISABLE_AUTH: ${DISABLE_AUTH:-false}
    volumes:
      - ./backend:/app
      - ./core_shared:/core_shared
      - backend_cache:/app/.cache
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      oauth-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - personal-management
    restart: unless-stopped
    command: ${BACKEND_COMMAND:-/start-dev.sh}

  # ============================================================================
  # FRONTEND SERVICES
  # ============================================================================

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-development}
        NODE_ENV: ${NODE_ENV:-development}
    container_name: ${CONTAINER_PREFIX:-pms}-frontend
    profiles: [dev, prod]
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_OAUTH_PROVIDER_URL=${NEXT_PUBLIC_OAUTH_PROVIDER_URL:-http://localhost:4444}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
      - NODE_ENV=${NODE_ENV:-development}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-true}
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - personal-management
    restart: unless-stopped

  # ============================================================================
  # INTEGRATION SERVICES
  # ============================================================================

  google-worker:
    build:
      context: .
      dockerfile: integration_workers/google/Dockerfile
    container_name: ${CONTAINER_PREFIX:-pms}-google-worker
    profiles: [dev, test, prod]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${CONTAINER_PREFIX:-pms}-postgres:5432/${DB_NAME:-personal_management}
      REDIS_URL: redis://${CONTAINER_PREFIX:-pms}-redis:6379
      REDIS_HOST: ${CONTAINER_PREFIX:-pms}-redis  # For integration tests
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dev-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dev-google-client-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-KzC1vYhL3bQpT_x5Ue8q0Wl1MvX-oVwYwK9cQx7lKHg=}
      LOG_LEVEL: ${WORKER_LOG_LEVEL:-DEBUG}
      WORKER_ID: google-worker
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
      # Periodic sync configuration
      # Set to 'true' to enable automatic periodic syncing of Google Contacts
      # When enabled, the worker will automatically sync all active Google accounts
      # at the configured interval
      ENABLE_PERIODIC_SYNC: ${ENABLE_PERIODIC_SYNC:-false}
      # Sync interval in hours (default: 6 hours)
      # Determines how often to sync contacts from Google
      # Examples: 1 (hourly), 6 (every 6 hours), 12 (twice daily), 24 (daily)
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-6}
    volumes:
      - ./core_shared:/core_shared:ro
      - ./integration_workers/google:/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - personal-management
    restart: unless-stopped

  # ============================================================================
  # PRODUCTION SERVICES
  # ============================================================================

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-pms}-nginx
    profiles: [prod]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - personal-management
    restart: unless-stopped

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  backend_cache:
    driver: local
  frontend_modules:
    driver: local
  frontend_next:
    driver: local
  nginx_logs:
    driver: local
  hydra_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  personal-management:
    name: personal-management
    driver: bridge
