version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: personal-management-db
    environment:
      POSTGRES_DB: personal_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_management"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - personal-management

  # MeiliSearch Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.2
    container_name: personal-management-search
    environment:
      - MEILI_MASTER_KEY=personal_management_search_key
      - MEILI_ENV=development
      - MEILI_LOG_LEVEL=INFO
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - personal-management

  # Redis for ARQ Task Queue
  redis:
    image: redis:7-alpine
    container_name: personal-management-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - personal-management

  # Python FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        BUILD_ENV: production
        INSTALL_DEV_DEPS: "false"
    container_name: personal-management-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/personal_management
      DEBUG: "false"
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: personal_management_search_key
      SESSION_SECRET_KEY: personal_management_session_secret_key_change_in_production
      SEARCH_INDEX_PREFIX: pms_
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
      - ./core_shared:/core_shared
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - personal-management
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BUILD_ENV: production
        NODE_ENV: production
    container_name: personal-management-frontend
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - personal-management
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: personal-management-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - personal-management
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  meilisearch_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  personal-management:
    driver: bridge
