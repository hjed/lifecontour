[project]
name = "core_shared"
version = "0.1.0"
description = "Shared models and utilities for Personal Management System integrations"
authors = [
    {name = "Personal Management System", email = "dev@example.com"}
]
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "prometheus-client>=0.25.0",
    "redis>=8.0.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
    "opentelemetry-instrumentation-httpx>=0.42b0",
    "opentelemetry-instrumentation-logging>=0.62b1",
    "opentelemetry-instrumentation-redis>=0.62b1",
    "opentelemetry-exporter-otlp>=1.41.1",
]

[project.optional-dependencies]
dev = [
    # arq is a dev-only dependency: redis_settings_from_url imports it lazily so
    # core_shared installs without it (arq pins redis<6 vs our redis>=8). Tests
    # and the consuming workers always have arq available.
    "arq>=0.26",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.18",
    "mypy>=2.1.0",
    "types-psycopg2>=2.9.21.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core_shared"]

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*" = ["B011", "DTZ"]
"tests/**/conftest.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
plugins = [
    "pydantic.mypy"
]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["core_shared"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "arq>=0.26",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.15.18",
]

[tool.uv]
override-dependencies = ["redis>=8.0.0"]

